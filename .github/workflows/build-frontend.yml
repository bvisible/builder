name: build-frontend

on:
  # //// Neoffice — a manual run rebuilds the artifacts when a push touched no frontend file
  # //// (a merge, a lockfile-only change) or when the bot's artifact push lost a race.
  workflow_dispatch:
  push:
    branches: [version-15, version-15-amont-1.33]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'yarn.lock'
      - '!**/node_modules/**'
      - '!builder/public/frontend/**'
      - '!builder/www/_builder.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install (workspace)
        run: yarn install --frozen-lockfile

      # //// Neoffice — vue-tsc over frontend/src (frontend/scripts/type-check.mjs ignores
      # //// frappe-ui's shipped sources). Informational for now: upstream's own files carry
      # //// ~130 errors (StyleValue vs string in block.ts and the canvas composables) that a
      # //// merge does not own; the step turns blocking once upstream's count is zero.
      - name: Type-check (frontend/src, informational)
        continue-on-error: true
        run: yarn --cwd frontend type-check

      - name: Build
        # FORCE_REBUILD bypasses the root package.json gate: in a CI checkout the
        # committed artifacts always exist, so a plain `yarn build` would skip and
        # ship stale assets. CI (16 GB) must always rebuild; client servers keep
        # the skip gate.
        run: FORCE_REBUILD=1 yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/public/frontend builder/www/_builder.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          # //// Neoffice — a push that landed on the branch during the build (a merge, a fix)
          # //// made this push a non-fast-forward twice on 2026-09-08; rebase the artifact
          # //// commit on the current head before pushing.
          git pull --rebase --autostash --no-verify origin "${GITHUB_REF_NAME}" || true
          git push
