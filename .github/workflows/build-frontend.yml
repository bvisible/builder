name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'yarn.lock'
      - '!**/node_modules/**'
      - '!builder/public/frontend/**'
      - '!builder/www/_builder.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install (workspace)
        run: yarn install --frozen-lockfile

      - name: Build
        # FORCE_REBUILD bypasses the root package.json gate: in a CI checkout the
        # committed artifacts always exist, so a plain `yarn build` would skip and
        # ship stale assets. CI (16 GB) must always rebuild; client servers keep
        # the skip gate.
        run: FORCE_REBUILD=1 yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder/public/frontend builder/www/_builder.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
