name: Regenerate POT file (translatable strings)
on:
  schedule:
    # 9:30 UTC => 3 PM IST Sunday
    - cron: "30 9 * * 0"
  workflow_dispatch:

jobs:
  regenerate-pot-file:
    name: Regenerate POT file
    # //// Neoffice — upstream's weekly POT pull request, made with upstream's release token
    # //// against upstream's develop. On this fork it checked out a develop branch without
    # //// the helper script and failed (first scheduled run 2026-09-13, after the 1.33
    # //// merge); the fork keeps its own catalogues, so the job runs in frappe/builder only.
    if: github.repository == 'frappe/builder'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["develop"]
    permissions:
      contents: write

    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            ref: ${{ matrix.branch }}

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"

        - name: Setup Node
          uses: actions/setup-node@v6
          with:
            node-version: 24

        - name: Run script to update POT file
          run: |
            bash ${GITHUB_WORKSPACE}/.github/helper/update_pot_file.sh
          env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            BASE_BRANCH: ${{ matrix.branch }}
