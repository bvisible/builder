name: Tests
# Fleet CI for this product fork (wave 2). Mechanics live in bvisible/neoffice-ci
# (frappe-app-ci.yml): bench init on OUR frappe fork, deps, run-tests,
# report to the hub (one [CI] issue per repo, closed by the green).
# Nightly + PR + on demand — not on push: the upstream CI and the build bot
# already run there, a second run per bot commit would only add noise.
on:
  # nightly paused on 2026-09-03 until #198 is treated (known red: every night mailed a failure);
  # run on demand or on a PR meanwhile, and put the cron back when the issue closes.
  pull_request:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args for bench run-tests (e.g. --debug-records)"
        required: false
        default: ""
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: builder
      skip_build: true   # SPA commit-the-build: assets committed, never built on instances
      # …but the page tests render frappe web templates (test_publish_unpublish
      # asserts the 404 of an unpublished page), and the CI bench is initialised
      # with --skip-assets: no sites/assets/assets.json, so bundled_asset() dies
      # on "'NoneType' object has no attribute 'get'". Build frappe's assets, the
      # way every instance has them.
      build_frappe_assets: true
      test_args: ${{ inputs.test_args || '' }}
    # inherit: CI_REPORT_SECRET (deps are public forks: no read token needed)
    secrets: inherit
