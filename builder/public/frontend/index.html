<!DOCTYPE html>
<html lang="en" class="overscroll-none">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/assets/builder/frontend/builder_logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- <script src="https://cdn.tailwindcss.com"></script> -->
		<title>Frappe Builder</title>
		<script type="module" crossorigin src="/assets/builder/frontend/assets/index-Co7uy0YA.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/builder/frontend/assets/index-DB6qd3mh.css">
	</head>
	<body class="overscroll-none bg-surface-base no-scrollbar selection:bg-gray-500/30" style="scrollbar-width: auto;">
		<div id="app"></div>
		<div id="popovers"></div>

		<script>
			window.csrf_token = "{{ csrf_token }}";

          <script>

              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>

</html>
