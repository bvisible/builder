{#
  Contact Form - Modular shortcode component
  v1.0.0 - Reads options from "Contact Us Settings" DocType

  Usage: {% include 'builder/templates/includes/contact_form.html' %}
#}
{% set contact = frappe.get_doc("Contact Us Settings") -%}

<div class="contact-form-shortcode">
    <form id="frappe-contact-form" onsubmit="return submitContactForm(event)">
        <input type="text" name="sender_name" placeholder="{{ _('Your name') }}" required>
        <input type="email" name="email" placeholder="{{ _('Your email') }}" required>

        {% if contact.query_options -%}
        <select name="subject" required>
            <option value="">{{ _("Choose a subject") }}</option>
            {% for option in contact.query_options.split('\n') -%}
            {% if option.strip() -%}
            <option value="{{ option.strip() }}">{{ option.strip() }}</option>
            {% endif -%}
            {% endfor -%}
        </select>
        {% else -%}
        <input type="text" name="subject" placeholder="{{ _('Subject') }}" required>
        {% endif -%}

        <textarea name="message" rows="5" placeholder="{{ _('Your message') }}" required></textarea>

        <button type="submit">{{ _("Send") }}</button>
        <div class="contact-form-message"></div>
    </form>
</div>

<style>
.contact-form-shortcode {
    width: 100%;
}
.contact-form-shortcode form {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
}
.contact-form-shortcode input,
.contact-form-shortcode select,
.contact-form-shortcode textarea {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    font-family: inherit;
    color: inherit;
    background: rgba(255,255,255,0.9);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.contact-form-shortcode input:focus,
.contact-form-shortcode select:focus,
.contact-form-shortcode textarea:focus {
    outline: none;
    border-color: currentColor;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
}
.contact-form-shortcode textarea {
    min-height: 120px;
    resize: vertical;
}
.contact-form-shortcode button[type="submit"] {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: white;
    background: #3B82F6;
    background: var(--primary-color, #3B82F6);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    align-self: flex-start;
}
.contact-form-shortcode button[type="submit"]:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}
.contact-form-shortcode button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.contact-form-message {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
}
.contact-form-message.success {
    background: #d4edda;
    color: #155724;
}
.contact-form-message.error {
    background: #f8d7da;
    color: #721c24;
}
</style>

<script>
function submitContactForm(e) {
    e.preventDefault();
    var form = document.getElementById('frappe-contact-form');
    var formData = new FormData(form);
    var msgDiv = form.querySelector('.contact-form-message');
    var btn = form.querySelector('button[type="submit"]');
    var originalText = btn.innerText;

    btn.disabled = true;
    btn.innerText = '{{ _("Sending...") }}';

    frappe.call({
        method: 'frappe.www.contact.send_message',
        args: {
            sender: formData.get('email'),
            sender_name: formData.get('sender_name'),
            message: formData.get('message'),
            subject: formData.get('subject')
        },
        callback: function(r) {
            btn.disabled = false;
            btn.innerText = originalText;

            if (r.message === 'okay') {
                msgDiv.className = 'contact-form-message success';
                msgDiv.innerText = '{{ _("Thank you! Your message has been sent.") }}';
                form.reset();
            } else {
                msgDiv.className = 'contact-form-message error';
                msgDiv.innerText = '{{ _("An error occurred. Please try again.") }}';
            }

            setTimeout(function() { msgDiv.innerText = ''; }, 5000);
        },
        error: function() {
            btn.disabled = false;
            btn.innerText = originalText;
            msgDiv.className = 'contact-form-message error';
            msgDiv.innerText = '{{ _("An error occurred. Please try again.") }}';
        }
    });

    return false;
}
</script>
