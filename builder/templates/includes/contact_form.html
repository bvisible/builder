{# Contact Form Template - Functional form that submits to Frappe #}
<div class="builder-contact-form">
    <form action="/api/method/frappe.www.contact.send_message" method="POST" class="contact-form">
        <input type="hidden" name="cmd" value="frappe.www.contact.send_message">
        <input type="hidden" name="subject" value="Contact depuis le site web">

        <div class="form-row">
            <div class="form-group">
                <label for="sender_name">{{ _("Name") }} <span class="required">*</span></label>
                <input type="text" id="sender_name" name="sender" required
                       placeholder="{{ _('Your name') }}">
            </div>
            <div class="form-group">
                <label for="sender_email">{{ _("Email") }} <span class="required">*</span></label>
                <input type="email" id="sender_email" name="sender" required
                       placeholder="{{ _('your.email@example.com') }}">
            </div>
        </div>

        <div class="form-group">
            <label for="contact_phone">{{ _("Phone") }}</label>
            <input type="tel" id="contact_phone" name="phone"
                   placeholder="{{ _('+41 XX XXX XX XX') }}">
        </div>

        <div class="form-group">
            <label for="contact_message">{{ _("Message") }} <span class="required">*</span></label>
            <textarea id="contact_message" name="message" rows="5" required
                      placeholder="{{ _('How can we help you?') }}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            {{ _("Send Message") }}
        </button>
    </form>
</div>

<style>
.builder-contact-form {
    max-width: 600px;
    margin: 0 auto;
}
.builder-contact-form .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}
@media (max-width: 576px) {
    .builder-contact-form .form-row {
        grid-template-columns: 1fr;
    }
}
.builder-contact-form .form-group {
    margin-bottom: 1.5rem;
}
.builder-contact-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: var(--text-color, #1f2937);
}
.builder-contact-form .required {
    color: #ef4444;
}
.builder-contact-form input,
.builder-contact-form textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--surface-color, #ffffff);
    color: var(--text-color, #1f2937);
}
.builder-contact-form input:focus,
.builder-contact-form textarea:focus {
    outline: none;
    border-color: var(--primary-color, #3b82f6);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
.builder-contact-form textarea {
    resize: vertical;
    min-height: 120px;
}
.builder-contact-form button[type="submit"] {
    width: 100%;
    padding: 1rem 2rem;
    background: var(--primary-color, #3b82f6);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}
.builder-contact-form button[type="submit"]:hover {
    background: var(--primary-color-dark, #2563eb);
    transform: translateY(-1px);
}
</style>
