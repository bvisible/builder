{# //// Neoffice — added file (no upstream equivalent): Jinja block: a contact form that really submits to
   //// Frappe. Reusable block the generator may include; Neoffice-only. First commit 747f0f91 2026-02-03. #}
{# Contact Form Template - Functional form that submits to Frappe #}
<div class="builder-contact-form">
    <form action="/api/method/frappe.www.contact.send_message" method="POST" class="contact-form">
        <input type="hidden" name="cmd" value="frappe.www.contact.send_message">
        <input type="hidden" name="subject" value="Contact depuis le site web">

        <div class="form-row">
            <div class="form-group">
                <label for="sender_name">{{ _("Name") }} <span class="required">*</span></label>
                <input type="text" id="sender_name" name="sender" required
                       placeholder="{{ _('Your name') }}">
            </div>
            <div class="form-group">
                <label for="sender_email">{{ _("Email") }} <span class="required">*</span></label>
                <input type="email" id="sender_email" name="sender" required
                       placeholder="{{ _('your.email@example.com') }}">
            </div>
        </div>

        <div class="form-group">
            <label for="contact_phone">{{ _("Phone") }}</label>
            <input type="tel" id="contact_phone" name="phone"
                   placeholder="{{ _('+41 XX XXX XX XX') }}">
        </div>

        <div class="form-group">
            <label for="contact_message">{{ _("Message") }} <span class="required">*</span></label>
            <textarea id="contact_message" name="message" rows="5" required
                      placeholder="{{ _('How can we help you?') }}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            {{ _("Send Message") }}
        </button>
    </form>
</div>

<style>
.builder-contact-form {
    max-width: 600px;
    margin: 0 auto;
}
.builder-contact-form .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}
@media (max-width: 576px) {
    .builder-contact-form .form-row {
        grid-template-columns: 1fr;
    }
}
.builder-contact-form .form-group {
    margin-bottom: 1.5rem;
}
/* //// Neoffice — the form wears the ink of the section it sits in (neoffice-maintenance#394).
   It wore the site's tokens (--text-color, --surface-color): on a dark site, in a light band
   the page put it in, the labels were light on light (only the red asterisks showed) and the
   fields black. The section's own text reads on its ground (the contrast pass,
   site_ai/nora/contrast.py, rewrites it when it does not), so the labels take that ink and the
   fields are drawn from it: border, text and caret in that colour, the ground showing through. */
.builder-contact-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    color: inherit;
}
.builder-contact-form .required {
    color: #ef4444;
}
.builder-contact-form input,
.builder-contact-form textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: transparent;
    color: inherit;
}
.builder-contact-form input::placeholder,
.builder-contact-form textarea::placeholder {
    color: inherit;
    opacity: 0.55;
}
.builder-contact-form input:focus,
.builder-contact-form textarea:focus {
    outline: none;
    border-color: currentColor;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
}
.builder-contact-form textarea {
    resize: vertical;
    min-height: 120px;
}
/* //// Neoffice — the label reads on the primary (--primary-text: dark on a pale primary), and
   the hover is the chrome's --primary-hover. --primary-color-dark is defined nowhere, so the
   button turned blue (#2563eb) under the pointer on every site. */
.builder-contact-form button[type="submit"] {
    width: 100%;
    padding: 1rem 2rem;
    background: var(--primary-color, #111111);
    color: var(--primary-text, #ffffff);
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}
.builder-contact-form button[type="submit"]:hover {
    background: var(--primary-hover, var(--primary-color, #111111));
    transform: translateY(-1px);
}
</style>
