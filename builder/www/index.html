{% set builder_home = frappe.db.get_value("Builder Page", {"route": "home", "published": 1}, "name") %}
{% if builder_home %}
<script>window.location.replace('/home');</script>
<meta http-equiv="refresh" content="0;url=/home">
{% else %}
<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Site en construction</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box}
		body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center}
		.c{text-align:center;padding:40px 24px;max-width:520px}
		.c h1{font-size:28px;font-weight:700;color:#1a1a2e;margin-bottom:12px}
		.c p{font-size:16px;color:#64748b;line-height:1.6}
		.b{display:inline-block;margin-top:24px;padding:8px 20px;background:#e8f5e9;color:#37ac50;border-radius:20px;font-size:13px;font-weight:600}
	</style>
</head>
<body>
	<div class="c">
		<div style="font-size:48px;margin-bottom:20px">&#9881;</div>
		<h1>Site en construction</h1>
		<p>Notre nouveau site arrive bientot.<br>Revenez nous voir prochainement !</p>
		<div class="b">Coming soon</div>
	</div>
</body>
</html>
{% endif %}
