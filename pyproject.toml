[project]
name = "builder"
authors = [
    { name = "Suraj Shetty", email = "suraj@frappe.io"}
]
description = "Modern website builder for modern web pages"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "jsmin>=3.0.1",
    "csscompressor>=0.9.5",
    "pandas (>=2.3.2,<3.0.0)",
    "duckdb==1.4.3",
    "litellm==1.95.1",
    "json-repair>=0.30",
    # //// Neoffice — runtime dependencies of builder/site_ai/** (litellm and json-repair now come
    # //// from upstream above; the Ollama client stays until site_ai moves onto builder.ai.llm).
    "ollama>=0.4.0",
    # //// Neoffice — the ingestion and visual-verification dependencies, plus the
    # //// scikit-learn extra below. None of this exists upstream.
    # Client content ingestion + visual verification loop (now core features,
    # so they must install on EVERY instance — not optional):
    "pillow>=10.0.0",      # image downscale before vision calls
    "pdfplumber>=0.11.0",  # document text extraction (primary)
    "pypdf>=4.0.0",        # PDF text extraction fallback
    "python-docx>=1.1.0",  # .docx text extraction
    # Server-side page screenshots for the visual critique loop.
    # ⚠️ Also needs the browser binary, which is NOT pip-installable:
    #    cd ~/frappe-bench && ./env/bin/playwright install chromium-headless-shell
    # That step MUST be added to devops provisioning/update or screenshots fail.
    "playwright>=1.40.0",
]

[project.optional-dependencies]
inspiration = [
    "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://frappe.io/builder"
Repository = "https://github.com/frappe/builder.git"
"Bug Reports" = "https://github.com/frappe/builder/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# 16.36.1 is the first release whose @framework/ui ships telemetry and TrialBanner,
# which the frontend imports; older benches fail the build instead of the update check
# //// Neoffice — the whole fleet runs frappe v15 and the editor is never built on a bench: the CI builds it
# //// (build-frontend.yml) against frappe's version-15 ui/, which carries telemetry and TrialBanner, and commits
# //// the artifacts. So the floor stays where v1.35.1 had it (">=16.36.1" would refuse every instance).
frappe = ">=15.0.0,<18.0.0"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "./builder/public/frontend"
index_html_path = "./builder/www/_builder.html"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
